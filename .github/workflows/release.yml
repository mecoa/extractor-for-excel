name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --dev

      - name: Build exe
        run: uv run pyinstaller packaging/windows.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtractorForExcel-windows
          path: dist/ExtractorForExcel.exe

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ExtractorForExcel.exe
          generate_release_notes: true
