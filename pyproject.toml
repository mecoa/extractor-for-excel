[project]
name = "extractor-for-excel"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "openpyxl",
    "pandas",
    "httpx",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "python-multipart>=0.0.32",
    "keyring>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "fpdf2>=2.8.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
extractor-for-excel = "web_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/core", "app/models", "app/web"]

[tool.hatch.build.targets.wheel.force-include]
"web_main.py" = "web_main.py"
"app/web/static" = "app/web/static"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
