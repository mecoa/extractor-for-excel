[project]
name = "extractor-for-excel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "openpyxl",
    "pandas",
    "httpx",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "python-multipart>=0.0.32",
    "pytest>=9.1.1",
]

[project.scripts]
extractor-for-excel = "main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
